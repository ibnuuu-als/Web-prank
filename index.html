
<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Minta Maaf ke Kamu 🥺💖</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<!-- Step 1: Input name -->
	<div class="card" id="nameCard">
		<h1>Hai kamu 💕</h1>
		<p>Boleh pencet tombol dibawah? 🥰</p>
		<button id="startBtn">Lanjut 💌</button>
	</div>

	<!-- Step 2: Minta maaf -->
	<div class="card" id="apologyCard" style="display: none;">
	  <div class="slide"><img src="https://raw.githubusercontent.com/ibnuuu-als/Web-prank/refs/heads/main/IMG_20261022_151349_163.jpg"></div>
		<h1>Dia ganteng gak? 💖</h1>
		<p id="apologyText">Jawab jujur yaaa.</p>
		<div class="btn-group">
			<button id="yesBtn">ganteng 💖</button>
			<button id="noBtn">Enggak 😠</button>
		</div>
	</div>

	<!-- signature placed under the card(s) -->
	<div class="footer">
		Made by
		<a href="https://www.instagram.com/ibedeaj?igsh=MW0weXhtb3BoamNkNQ==" target="_blank" rel="noopener">
			Ige:ibedeaj
		</a>
		🤩
	</div>

	<!-- Popup -->
	<div class="popup" id="popup">
		<div class="popup-content">
			<h2 id="popupTitle"></h2>
			<p id="popupMsg"></p>
			<div class="hearts" id="hearts"></div>
		</div>
	</div>

	<script src="script.js"></script>
</body>
</html>
